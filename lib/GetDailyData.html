  <body>

    <div id="dots_container" style="display: none;">Updating data (average 80 sec)<span id="dots"></span></div>
    <input type="button" value="Update" id="save_btn" style="margin: 7px 0 0 auto;
                                                          display: block;
                                                          font-size: 16px;
                                                          border-radius: 14px;
                                                          padding: 2px 12px;
                                                          cursor: pointer;" />
    <script>
      function showLoader() {
        document.getElementById('dots_container').style.display = 'block';
        document.getElementById('save_btn').disabled = true;
      }

      function hideLoader() {
        document.getElementById('dots_container').style.display = 'none';
        document.getElementById('save_btn').disabled = false;
        document.getElementById('dots_container').innerHTML = 'Updating data (average 80 sec)<span id="dots"></span>';
      }
